name: Two Islands 2035 CI

on:
  push:
    paths:
      - 'hainan-singapore-2035/**'
      - '.github/workflows/two-islands-ci.yml'
  pull_request:
    paths:
      - 'hainan-singapore-2035/**'
      - '.github/workflows/two-islands-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: hainan-singapore-2035
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.25.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pnpm install --frozen-lockfile
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - name: Check standalone Worker deployment config (dry run)
        env:
          TWO_ISLANDS_D1_DATABASE_ID: 11111111-1111-4111-8111-111111111111
        run: node scripts/deploy/prepare-cloudflare.mjs
