name: Two Islands 2035 official-source updates

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: two-islands-2035-data
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: hainan-singapore-2035
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate data updater tests
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Collect official-source metadata
        run: python3 scripts/update_data.py
      - name: Commit only dual-island data changes
        shell: bash
        run: |
          git add hainan-singapore-2035/data/latest.json hainan-singapore-2035/data/history/
          if git diff --cached --quiet; then
            echo "No source changes; nothing to commit."
            exit 0
          fi
          git config user.name 'two-islands-data[bot]'
          git config user.email 'two-islands-data[bot]@users.noreply.github.com'
          git commit -m "data: refresh Two Islands official-source metadata"
          git push
