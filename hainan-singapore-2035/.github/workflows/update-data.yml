name: Collect official source updates
on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *' # Asia/Shanghai 08:00; GitHub may queue scheduled runs.
permissions:
  contents: write
concurrency:
  group: two-islands-data
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - run: python3 scripts/update_data.py
      - name: Commit only data changes
        shell: bash
        run: |
          git add data/latest.json data/history/
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'two-islands-data[bot]'
          git config user.email 'two-islands-data[bot]@users.noreply.github.com'
          git commit -m "data: refresh official source metadata"
          git push
