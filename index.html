<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="refresh" content="0;url=portal.html">
<title>惠东产业风洞</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{display:flex;align-items:center;justify-content:center;background:#080b12;color:#e6edf3;
    font:15px/1.7 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;padding:24px;text-align:center}
  .card{max-width:420px}
  .kick{font-size:11px;letter-spacing:4px;color:#67e8f9;margin-bottom:14px}
  h1{font-size:22px;margin:0 0 10px;color:#fff}
  p{color:#93a4bd;margin:0 0 18px}
  a{display:inline-block;background:#0e7490;color:#fff;text-decoration:none;padding:10px 22px;
    border-radius:20px;font-size:14px;font-weight:600}
</style>
<link rel="stylesheet" href="ui/premium.css">
<script>/* premium 样式偶发 503：失败自动重试一次 */
(function(){var r={};Array.prototype.forEach.call(
document.querySelectorAll('link[rel="stylesheet"][href*="premium"]'),
function(l){l.addEventListener("error",function(){if(r[l.href])return;r[l.href]=1;
var s=document.createElement("link");s.rel="stylesheet";
s.href=l.href.split("?")[0]+"?retry="+Date.now();document.head.appendChild(s);});});})();</script>
</head>
<body>
  <div class="card">
    <div class="kick">HUIDONG INDUSTRIAL WIND TUNNEL</div>
    <h1>正在进入惠东产业风洞</h1>
    <p>如未自动跳转，请点击下方按钮。</p>
    <a href="portal.html">进入系统</a>
  </div>
  <script>location.replace('portal.html');</script>
</body>
</html>
