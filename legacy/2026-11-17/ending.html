.metric-row + .metric-row { margin-top: 4px }
.metric-row:hover { background: #7dd3fc10 }
.metric-row .metric-name { font-weight: 680; font-size: clamp(12px, 1.03vw, 15px); line-height: 1.2 }

.chart-note, .chart-hint { margin: 9px 0 0; color: var(--muted); font-size: 11.5px }

.scenario {

.scenario h3 { margin: 0; font-size: clamp(17px, 1.5vw, 22px) }

.case-buttons { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 9px }
.case-buttons button {

.case-buttons button:hover, .case-buttons button[aria-pressed="true"] { border-color: var(--aqua); background: #0e3a4a }

.path li {

.path li:last-child { background: #0e3a4a; border-color: #5eead4 }

.sources { margin-top: 4px }

.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; border: 0 }

  }

  function renderBallot(topic) {
    const { title, choices } = topic.guess;
    document.getElementById('trial-title').innerHTML = `${title[0]}<br><em>${title[1]}</em>`;
    document.getElementById('trial-scope').textContent = topic.scope;
    ballot.innerHTML = choices.map((choice, index) => `<button type="button" data-vote="${index}" aria-controls="trial-reveal" aria-pressed="false">${choice}</button>`).join('');
  }

  function showReveal(visible) {
    const topic = topics[currentTopic];
    const picked = votes.get(currentTopic);
    const hasVote = picked !== undefined;
    stage.dataset.open = String(visible);
    detail.hidden = !visible;
    reveal.hidden = !visible;
    shutter.hidden = visible;
    retake.hidden = !visible;
    verdict.textContent = visible && hasVote
      ? (picked === topic.guess.correct ? '你的判断与这一年的数据对上了。' : '这一年的数据给出了另一边的答案。')
      : '';
    verdict.dataset.right = String(hasVote && picked === topic.guess.correct);
    for (const button of ballot.querySelectorAll('[data-vote]')) {
      button.setAttribute('aria-pressed', String(visible && Number(button.dataset.vote) === picked));
    }
    if (!visible) return;
    document.getElementById('impact-pair').innerHTML = topic.featured.map(metric => `
      <div class="impact-stat" style="--stat-ink:${metric.color}">
        <strong>${metric.value}</strong><span>${metric.label}</span>
      </div>`
    ).join('');
    document.getElementById('trial-insight').textContent = topic.guess.insight;
  }

  function renderChart(topic) {
    const chart = topic.chart;
    const rows = chart.rows.map(row => `
      <div class="metric-row reading ${row.down ? 'down' : ''}">
        <span class="metric-name">${row.label}</span>
        ${track(row.amount, chart.max)}
        <strong class="value">${row.value}</strong>
      </div>`
    ).join('');
    leadChart.innerHTML = `<figure class="chart">
      <figcaption class="chart-caption"><h3>${chart.title}</h3><span class="scope">${chart.scope}</span></figcaption>
      <div class="amount-scale" aria-hidden="true"><span>0</span><span>${chart.max}</span></div>
      ${rows}
      ${chart.note ? `<p class="chart-note">${chart.note}</p>` : ''}
    </figure>`;
  }

  function renderTopic(key) {
    const topic = topics[key];
    currentTopic = key;
    detail.dataset.topic = key;
    renderBallot(topic);
    questionTitle.innerHTML = `${topic.headline[0]}<wbr><span>${topic.headline[1]}</span>`;
    for (const button of wall.querySelectorAll('[data-question]')) {
      button.setAttribute('aria-pressed', String(button.dataset.question === key));
    }
    renderChart(topic);
    document.getElementById('scenario-setup').textContent = topic.setup;
    cases.innerHTML = topic.scenarios.map((scenario, index) =>
      `<button type="button" data-case="${index}" aria-pressed="false" aria-controls="case-path follow-question">${scenario.label}</button>`
    ).join('');
    evidence.open = false;
    sourceDetails.open = false;
    document.getElementById('source-list').innerHTML = topic.sourceKeys.map(id => {
      const { label, url } = sources[id];
      return `<li><a href="${url}">${label}</a></li>`;
    }).join('');
    showCase(key, selectedCases.get(key) ?? 0);
  }

  function showCase(key, choice) {
    const topic = topics[key];
    selectedCases.set(key, choice);
    const view = topic.scenarios[choice];
    for (const button of cases.querySelectorAll('[data-case]')) {
      button.setAttribute('aria-pressed', String(Number(button.dataset.case) === choice));
    }
    path.dataset.current = String(choice);
    pathSteps.forEach((step, index) => { step.textContent = view.steps[index]; });
    document.getElementById('case-summary').textContent = view.summary;
    document.getElementById('follow-question').textContent = view.question;
    document.getElementById('case-record').textContent = view.record;
  }

  function syncQuestion() {
    const [key, choice] = location.hash.slice(1).split('/');
    if (!Object.hasOwn(topics, key)) {
      renderTopic('tourists');
      showReveal(false);
      return;
    }
    const visible = choice === '0' || choice === '1';
    renderTopic(key);
    if (visible) openTopics.add(key);
    showCase(key, choice === '1' ? 1 : 0);
    showReveal(visible);
  }

  function setAddress(fragment) {
    if (location.hash !== fragment) history.pushState(null, '', fragment);
  }

  wall.addEventListener('click', event => {
    const button = event.target.closest('[data-question]');
    if (!button) return;
    const key = button.dataset.question;
    const choice = selectedCases.get(key) ?? 0;
    const open = openTopics.has(key);
    setAddress(open ? `#${key}/${choice}` : `#${key}`);
    renderTopic(key);
    showCase(key, choice);
    showReveal(open);
  });
  ballot.addEventListener('click', event => {
    const button = event.target.closest('[data-vote]');
    if (!button) return;
    votes.set(currentTopic, Number(button.dataset.vote));
    openTopics.add(currentTopic);
    setAddress(`#${currentTopic}/${selectedCases.get(currentTopic)}`);
    showReveal(true);
  });
  retake.addEventListener('click', () => {
    votes.delete(currentTopic);
    openTopics.delete(currentTopic);
    history.replaceState(null, '', `#${currentTopic}`);
    showReveal(false);
    ballot.querySelector('button').focus();
  });
  cases.addEventListener('click', event => {
    const button = event.target.closest('[data-case]');
    if (!button) return;
    const choice = Number(button.dataset.case);
    setAddress(`#${currentTopic}/${choice}`);
    showCase(currentTopic, choice);
    showReveal(true);
  });
  window.addEventListener('popstate', syncQuestion);
  window.addEventListener('hashchange', syncQuestion);
  syncQuestion();
})();
</script>

  <button type="button" onclick="likePage()">👍 <span id="pcount">0</span></button>
  <button type="button" data-duel-footer>发这题给朋友</button>
</div>
