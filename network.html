<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>惠东产业风洞 · 关系网</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080b12;color:#e6edf3;font:14px/1.65 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
.wrap{max-width:1200px;margin:auto;padding:18px}

/* hero */
.hero{position:relative;text-align:center;padding:44px 22px 38px;background:
   radial-gradient(ellipse at 50% 130%, #0e3a4a 0%, #082630 40%, #0a0f1a 78%);
  border:1px solid #1c2739;border-radius:16px;margin-bottom:16px;overflow:hidden}
.hero .kick{font-size:11px;letter-spacing:4px;color:#67e8f9;margin-bottom:10px}
.hero h1{font-size:26px;line-height:1.4;margin:0;color:#fff}
.hero h1 .sea{color:#fbbf24}
.hero .sub{font-size:13px;color:#a9b6c9;margin:12px auto 0;max-width:620px;line-height:1.8}

.actbar{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.btn{background:#0e7490;color:#fff;border:0;padding:10px 22px;border-radius:8px;font-size:13.5px;font-weight:600;cursor:pointer}
.cnt{font-size:12px;color:#7d8fa5;font-variant-numeric:tabular-nums}

.stage{background:radial-gradient(ellipse at center,#082028,#080b12);border:1px solid #1c2739;border-radius:14px;position:relative;overflow:hidden;margin-bottom:16px}
svg{display:block;width:100%;height:auto}
.acttitle{position:absolute;top:12px;left:50%;transform:translateX(-50%);font-size:13px;font-weight:700;letter-spacing:2px;color:#cbd5e1;z-index:5}
.legend{position:absolute;bottom:9px;left:12px;font-size:10.5px;color:#6b7d96;display:flex;gap:12px;flex-wrap:wrap;z-index:5}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px;vertical-align:middle}
.gnode{opacity:0;animation:flyIn .55s cubic-bezier(.2,.8,.3,1) forwards}
.gnode circle{filter:drop-shadow(0 0 6px currentColor)}
@keyframes flyIn{0%{opacity:0;transform:translateY(-42px)}60%{opacity:1;transform:translateY(3px)}100%{opacity:1;transform:translateY(0)}}
.edge{animation:drawEdge .6s ease-out forwards}
@keyframes drawEdge{to{stroke-dashoffset:0}}

.k3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}
@media(max-width:700px){.k3{grid-template-columns:1fr}}
.k3 .b{background:#0e1523;border:1px solid #1c2739;border-radius:12px;padding:16px}
.k3 .b .l{font-size:11px;color:#8fa3bf}
.k3 .b .v{font-size:20px;font-weight:800;margin-top:4px}
.k3 .b .d{font-size:11px;color:#6b7d96;margin-top:4px;line-height:1.6}

.plain{margin-bottom:14px;background:#082630;border:1px solid #134047;border-left:3px solid #0891b2;border-radius:10px;padding:14px 16px;font-size:13px;line-height:1.9;color:#cff3f8}
.plain .lab{display:block;font-size:10.5px;font-weight:800;color:#22d3ee;letter-spacing:1px;margin-bottom:4px}

.rank-section{margin-bottom:16px}
.rank-title{font-size:14px;font-weight:700;margin-bottom:10px;color:#cbd5e1}
.rank-row{display:flex;align-items:center;gap:8px;margin-bottom:6px;font-size:12px}
.rank-row .name{width:100px;flex:none;color:#cbd5e1;text-align:right;font-size:11px}
.rank-row .bar-bg{flex:1;height:14px;background:#0a0f1a;border-radius:3px;overflow:hidden}
.rank-row .bar{height:100%;border-radius:3px}
.rank-row .val{width:55px;flex:none;font-size:11px;color:#93a4bd;font-variant-numeric:tabular-nums}

.algo-note{font-size:11px;color:#5b6b82;padding:10px 12px;background:#0a0f1a;border-radius:8px;border-left:2px solid #2b3a55;line-height:1.8}
.blood-tag{display:inline-block;font-size:9px;padding:1px 5px;border-radius:3px;font-weight:700;margin-left:4px}
.blood-A{background:#14532d;color:#86efac}
.blood-B{background:#1e3a5f;color:#93c5fd}

.next{text-align:center;margin:20px 0}
.next a{background:#0e7490;color:#fff;padding:12px 28px;border-radius:8px;text-decoration:none;font-weight:600;display:inline-block}

</head><body class="hd-page hd-content">

<header class="hd-header">
  <div class="hd-header-inner">

<div class="wrap">

  <header class="hero">
    <h1>同一片海，<span class="sea">谁和谁连着？</span></h1>

  <div class="hd-selector" role="group" aria-label="关系图视角">

      <button class="hd-secondary" type="button" id="bReplay">重播完整关系</button>
      <div class="hd-link-row"><a class="hd-muted-link" href="v2/network.html">查看依据</a></div>
    </aside>
  </section>

  <details class="hd-details hd-reading">
    <summary>展开网络指标和来源</summary>
    <div class="k3">
      <div class="b"><div class="l">现在连得最多</div><div class="v" id="kDegree" style="color:#22d3ee">—</div><div class="d" id="kDegreeDesc"></div></div>
      <div class="b"><div class="l">关系记录</div><div class="v" id="relationCount" style="color:#fbbf24">—</div><div class="d">包含同一对主体的不同关系</div></div>
      <div class="b"><div class="l">图中经过最多的节点</div><div class="v" id="kBetween" style="color:#a78bfa">—</div><div class="d" id="kBetweenDesc"></div></div>
    </div>

    <div class="rank-section">
      <div class="rank-title">谁连得最多？</div>

    <div class="rank-section">
      <div class="rank-title">谁在关键路径上？</div>
      <div id="betweenRanks"></div>
    </div>

    <div class="algo-note">
      数据血统：<span class="blood-tag blood-A">A 实测</span>统计公报/官方发布 ｜
      <span class="blood-tag blood-B">B 推估</span>镇街与产业联系 ｜
      <span class="blood-tag blood-C">C 假设</span>岸线共用边权重 ｜
      网络结构由作者根据公开主体与关系构建，边权重含假设，可改参数复跑。
    </div>
  </details>

  <div class="next hd-link-row"><a href="role.html">从自己的角色看</a><a href="who.html">看惠东基本面</a></div>
</div>

<script>
const NODES=[
  {id:"sz",name:"深圳",x:80,y:430,type:"ext",w:3,label:"大湾区客源·产业"},
  {id:"gz",name:"广州",x:80,y:110,type:"ext",w:1,label:"省会·客源"},
  {id:"hy",name:"惠阳·惠城",x:60,y:290,type:"ext",w:2,label:"西连惠州主城"},
  {id:"ss",name:"深汕合作区",x:800,y:430,type:"ext",w:2,label:"东连特别合作区"},
  {id:"hk",name:"香港",x:130,y:545,type:"ext",w:1,label:"高端客源"},
  {id:"ps",name:"平山",x:430,y:300,type:"space",w:3,label:"县城·商圈"},
  {id:"dl",name:"大岭",x:360,y:355,type:"space",w:2,label:"产业新城"},
  {id:"rs",name:"稔山",x:325,y:470,type:"space",w:2,label:"高铁门户"},
  {id:"xl",name:"巽寮",x:420,y:535,type:"space",w:3,label:"年迎约390万"},
  {id:"ph",name:"平海",x:560,y:505,type:"space",w:3,label:"双月湾·古城"},
  {id:"gk",name:"港口",x:655,y:535,type:"space",w:2,label:"海龟湾"},
  {id:"tc",name:"铁涌",x:475,y:445,type:"space",w:2,label:"赤岸蚝乡"},
  {id:"hb",name:"黄埠",x:695,y:445,type:"space",w:2,label:"能源·女鞋"},
  {id:"jl",name:"吉隆",x:615,y:395,type:"space",w:2,label:"女鞋名镇"},
  {id:"bpz",name:"白盆珠",x:315,y:130,type:"space",w:1,label:"水库生态"},
  {id:"dz",name:"多祝",x:420,y:190,type:"space",w:1,label:"山区大镇"},
  {id:"ad",name:"安墩",x:530,y:125,type:"space",w:1,label:"温泉·蜜乡"},
  {id:"gt",name:"高潭",x:670,y:125,type:"space",w:1,label:"红色老区"},
  {id:"np",name:"太平岭核电",x:735,y:375,type:"ind",w:3,label:"华龙一号·6台"},
  {id:"wind",name:"海上风电",x:725,y:565,type:"ind",w:2,label:"百万千瓦"},
  {id:"lng",name:"LNG接收站",x:775,y:490,type:"ind",w:2,label:"海上天然气"},
  {id:"mat",name:"新材料产业园",x:295,y:285,type:"ind",w:3,label:"千亿级集群"},
  {id:"sci",name:"两大科学装置",x:245,y:225,type:"ind",w:2,label:"HIAF·CiADS"},
  {id:"shoe",name:"女鞋时尚",x:575,y:345,type:"ind",w:3,label:"中国女鞋基地"},
  {id:"tour",name:"滨海文旅",x:505,y:475,type:"ind",w:3,label:"年近1800万人次"},
  {id:"pot",name:"冬种马铃薯",x:295,y:425,type:"ind",w:2,label:"国家地理标志"},
  {id:"fish",name:"海洋渔业",x:445,y:540,type:"ind",w:2,label:"海洋牧场·渔港"},
  {id:"w1",name:"滨海游客",x:500,y:590,type:"talent",w:3,label:"年近1800万"},
  {id:"w2",name:"制造工人",x:545,y:295,type:"talent",w:2,label:"女鞋·制造"},
  {id:"w3",name:"能源建设者",x:700,y:315,type:"talent",w:2,label:"核电建设"},
  {id:"w4",name:"渔民养殖户",x:395,y:575,type:"talent",w:2,label:"渔排·渔船"},
  {id:"w5",name:"山区农业人口",x:455,y:95,type:"talent",w:1,label:"农林人口"},
  {id:"w6",name:"深圳周末客",x:160,y:475,type:"talent",w:2,label:"高铁自驾客源"}
];
const EDGES=[
  ["w6","sz",4,"A"],["sz","rs",3,"A"],["w6","xl",3,"B"],["w6","ph",3,"B"],
  ["gz","tour",2,"B"],["hk","tour",2,"C"],["hy","ps",3,"A"],["ss","hb",2,"B"],
  ["tour","xl",4,"A"],["tour","ph",4,"A"],["tour","gk",3,"A"],
  ["w1","tour",4,"A"],["xl","ph",3,"A"],["ph","gk",3,"A"],
  ["rs","xl",2,"B"],["tc","tour",2,"B"],
  ["np","hb",4,"A"],["w3","np",3,"A"],["wind","gk",3,"A"],
  ["lng","hb",3,"A"],["np","lng",2,"B"],
  ["shoe","jl",4,"A"],["shoe","hb",3,"A"],["w2","shoe",3,"A"],["jl","hb",2,"A"],
  ["fish","tc",3,"A"],["fish","gk",2,"B"],["w4","fish",3,"A"],
  ["tc","pot",2,"B"],["pot","rs",3,"A"],["pot","tc",2,"B"],
  ["mat","dl",3,"A"],["mat","ps",2,"B"],["sci","mat",2,"B"],["dl","ps",3,"A"],
  ["dz","ps",2,"B"],["bpz","dz",2,"C"],["ad","dz",2,"C"],["gt","ad",2,"C"],
  ["w5","dz",2,"C"],["tour","np",2,"C"],["fish","np",2,"C"],["gk","wind",2,"C"],
  ["w2","dl",2,"B"],["w3","hb",2,"B"],["rs","tc",2,"B"]
];
const COLORS={ind:"#0891b2",space:"#9aa6b8",talent:"#f97316",ext:"#a78bfa"};
const BLOOD_COLORS={A:"#22c55e",B:"#3b82f6",C:"#fbbf24"};
const SVGNS="http://www.w3.org/2000/svg";

function nodeById(id){return NODES.find(n=>n.id===id)}
function buildGraph(){
  const adj={};NODES.forEach(n=>adj[n.id]=[]);
  EDGES.forEach(([f,t])=>{adj[f].push(t);adj[t].push(f)});
  return adj;
}
function betweenness(adj){
  const scores={};NODES.forEach(n=>scores[n.id]=0);
  for(const src of NODES){
    const S=[],P={},sig={},d={};
    NODES.forEach(n=>{P[n.id]=[];sig[n.id]=0;d[n.id]=-1});
    sig[src.id]=1;d[src.id]=0;
    const Q=[src.id];
    while(Q.length){
      const v=Q.shift();S.push(v);
      for(const w of adj[v]){
        if(d[w]<0){d[w]=d[v]+1;Q.push(w)}
        if(d[w]===d[v]+1){sig[w]+=sig[v];P[w].push(v)}
      }
    }
    const delta={};NODES.forEach(n=>delta[n.id]=0);
    while(S.length){
      const w=S.pop();
      for(const v of P[w]){delta[v]+=(sig[v]/sig[w])*(1+delta[w])}
      if(w!==src.id)scores[w]+=delta[w];
    }
  }
  return scores;
}

const views = {
  shore: {
    title: "海边的生意和能源连在哪里？",
    note: "巽寮、平海和港口连着滨海文旅。图上的虚线表示旅游、渔业和核电可能共用部分岸线的情景假设。",
    positions: {xl:[66,56], ph:[198,56], gk:[334,56], wind:[493,56], tour:[137,160], fish:[308,160], np:[474,160]}
  },
  tour: {
    title: "外地客流怎样连到惠东？",
    note: "深圳周末客连向巽寮和平海。滨海文旅也连着广州和本地景点。",
    positions: {sz:[62,54], w6:[224,54], gz:[484,54], xl:[69,159], ph:[226,159], tour:[416,159]}
  },
  shoe: {
    title: "女鞋把两个镇和工人连在一起",
    note: "吉隆、黄埠与女鞋时尚联系较强，制造工人的关系还连到大岭。",
    positions: {jl:[72,65], shoe:[262,65], hb:[484,65], dl:[83,165], w2:[302,165]}
  },
  all: {
    title: "惠东与周边的完整关系图",
    note: "选一个视角可以放大关键关系。网络指标和来源可以在下方展开。"
  }
};

const svg = document.getElementById("svg");
const networkButtons = [...document.querySelectorAll("[data-network]")];

function renderNetwork(key, replay = false) {
  const view = views[key];
  const focus = view.positions;
  const nodes = focus ? NODES.filter(node => Object.hasOwn(focus, node.id)) : NODES;
  const visibleIds = new Set(nodes.map(node => node.id));
  const edges = EDGES.filter(([from, to]) => visibleIds.has(from) && visibleIds.has(to));
  const point = id => focus ? focus[id] : [nodeById(id).x, nodeById(id).y];
  document.getElementById("acttitle").textContent = view.title;
  document.getElementById("focus-note").textContent = view.note;
  document.getElementById("graph-title").textContent = view.title + "。实线为已录入和推估的关系，虚线为情景假设。";
  document.getElementById("cnt").textContent = nodes.length + " 个主体 · " + edges.length + " 条关系记录";
  svg.setAttribute("viewBox", focus ? "0 0 560 242" : "0 0 860 620");
  networkButtons.forEach(button => button.setAttribute("aria-pressed", String(button.dataset.network === key)));

  const lineGroup = document.getElementById("edges");
  const nodeGroup = document.getElementById("nodes");
  lineGroup.replaceChildren();
  nodeGroup.replaceChildren();
  for (const [i, [from, to, weight, evidence]] of edges.entries()) {
    const [x1, y1] = point(from), [x2, y2] = point(to);
    const line = document.createElementNS(SVGNS, "line");
    const style = {x1, y1, x2, y2, stroke: BLOOD_COLORS[evidence], "stroke-width": weight,
      "stroke-opacity": focus ? .7 : .46, "stroke-linecap": "round"};
    for (const [name, value] of Object.entries(style)) line.setAttribute(name, value);
    if (evidence === "C") line.setAttribute("stroke-dasharray", "5 5");
    const title = document.createElementNS(SVGNS, "title");
    title.textContent = nodeById(from).name + " · " + nodeById(to).name + " · " +
      {A:"公开资料", B:"推估关系", C:"情景假设"}[evidence];
    line.append(title);
    line.classList.add("hd-net-reveal");
    line.style.animationDelay = (replay ? 280 + i * 18 : i * 14) + "ms";
    lineGroup.append(line);
  }

  for (const [i, node] of nodes.entries()) {
    const [x, y] = point(node.id);
    const group = document.createElementNS(SVGNS, "g");
    const color = COLORS[node.type];
    const radius = (focus ? 12 : 7) + node.w * 2;
    group.classList.add("hd-net-reveal");
    group.style.animationDelay = (replay ? i * 22 : 0) + "ms";
    group.innerHTML = `<circle cx="${x}" cy="${y}" r="${radius}" fill="#122e3c" stroke="${color}" stroke-width="2"></circle>
      <circle cx="${x}" cy="${y}" r="${focus ? 5 : 4}" fill="${color}"></circle>
      <text x="${x}" y="${y + radius + (focus ? 23 : 12)}" text-anchor="middle" fill="#e6f3f1"
        font-weight="650" font-size="${focus ? 20 : 11}" stroke="#0e232d" stroke-width="3" paint-order="stroke">${node.name}</text>`;
    nodeGroup.append(group);
  }
}

const adjacency = buildGraph();
const degree = Object.fromEntries(NODES.map(node => [node.id, adjacency[node.id].length]));
for (const button of networkButtons) button.addEventListener("click", () => renderNetwork(button.dataset.network));
document.getElementById("bReplay").addEventListener("click", () => renderNetwork("all", true));
renderNetwork("shore");
showAfter(degree, betweenness(adjacency));

function showAfter(degree,btw){
  document.getElementById("relationCount").textContent = EDGES.length + " 条";
  const degSorted=Object.entries(degree).sort((a,b)=>b[1]-a[1]);
  const topDeg=nodeById(degSorted[0][0]);
  document.getElementById("kDegree").textContent=topDeg.name;
  document.getElementById("kDegreeDesc").textContent=`共有 ${degSorted[0][1]} 条相连的关系记录`;
  const maxDeg=Math.max(...Object.values(degree));
  document.getElementById("degreeRanks").innerHTML=degSorted.slice(0,8).map(([id,v])=>{
    const n=nodeById(id);
    return `<div class="rank-row"><span class="name">${n.name}</span><div class="bar-bg"><div class="bar" style="width:${v/maxDeg*100}%;background:${COLORS[n.type]}"></div></div><span class="val">${v}条</span></div>`;
  }).join("");
  const btwSorted=Object.entries(btw).sort((a,b)=>b[1]-a[1]);
  const topBtw=nodeById(btwSorted[0][0]);
  document.getElementById("kBetween").textContent=topBtw.name;
  document.getElementById("kBetweenDesc").textContent=`最短路径经过最多`;
  const maxBtw=btwSorted[0][1]||1;
  document.getElementById("betweenRanks").innerHTML=btwSorted.slice(0,8).map(([id,v])=>{
    const n=nodeById(id);
    return `<div class="rank-row"><span class="name">${n.name}</span><div class="bar-bg"><div class="bar" style="width:${v/maxBtw*100}%;background:#a78bfa"></div></div><span class="val">${v.toFixed(0)}</span></div>`;
  }).join("");
}

</script>
