<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>惠东产业风洞 · 统一入口</title>
<style>
:root{--bg:#070a11;--surface:#0e1523;--border:#1c2739;--text:#e6edf3;--muted:#93a4bd;--faint:#64748b;
--cyan:#22d3ee;--cyan2:#0891b2;--gold:#fbbf24;--violet:#8b5cf6;--green:#34d399}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);
  font:14px/1.65 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased;min-height:100vh;
  background-image:radial-gradient(ellipse at 20% -10%,rgba(8,145,178,.18),transparent 55%),
    radial-gradient(ellipse at 85% 10%,rgba(139,92,246,.14),transparent 50%)}
.wrap{max-width:1080px;margin:0 auto;padding:30px 20px 46px}

.brand{text-align:center;margin-bottom:8px}
.brand .dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--cyan);box-shadow:0 0 12px var(--cyan);margin-right:8px;vertical-align:middle}
.brand b{font-size:14px;letter-spacing:3px;color:#fff}
.hero{text-align:center;padding:34px 10px 26px}
.hero h1{font-size:34px;margin:0;color:#fff;letter-spacing:1px}
.hero h1 .ac{color:var(--gold)}
.hero p{color:var(--muted);font-size:14px;margin:14px auto 0;letter-spacing:2px}

.tracks{display:grid;grid-template-columns:1fr 56px 1fr;gap:0;align-items:stretch;margin-top:14px}
@media(max-width:760px){.tracks{grid-template-columns:1fr;gap:14px}.relay-mid{transform:rotate(90deg);height:56px}}
.track{position:relative;background:linear-gradient(165deg,rgba(20,30,46,.9),rgba(12,19,32,.92));
  border:1px solid var(--border);border-radius:18px;padding:26px 24px;display:flex;flex-direction:column;
  text-decoration:none;transition:.25s;overflow:hidden}
.track:hover{transform:translateY(-3px);border-color:#2c405c}
.track.cn{box-shadow:inset 0 0 0 1px rgba(34,211,238,.12)}
.track.rd{box-shadow:inset 0 0 0 1px rgba(251,191,36,.12)}
.track .ico{width:52px;height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center;margin-bottom:14px}
.track.cn .ico{background:rgba(8,145,178,.18);border:1px solid rgba(34,211,238,.4)}
.track.rd .ico{background:rgba(139,92,246,.16);border:1px solid rgba(251,191,36,.4)}
.track h2{font-size:20px;margin:0 0 6px;color:#fff}
.track .kic{font-size:11px;letter-spacing:2px;color:var(--faint);margin-bottom:14px}
.track .nodes{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:18px}
.track .nodes span{font-size:11.5px;color:#cdd9ea;background:rgba(255,255,255,.05);
  border:1px solid var(--border);padding:5px 11px;border-radius:14px}
.track .go{margin-top:auto;display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:13.5px}
.track.cn .go{color:var(--cyan)} .track.rd .go{color:var(--gold)}

.relay-mid{display:flex;align-items:center;justify-content:center;position:relative}
.relay-mid .line{width:2px;height:100%;background:linear-gradient(180deg,transparent,#2c405c,transparent)}
.relay-mid .chip{position:absolute;background:#0c1320;border:1px solid #2c405c;border-radius:10px;
  padding:8px 10px;writing-mode:vertical-rl;font-size:11px;color:var(--cyan);letter-spacing:2px}

.map-card{margin-top:26px;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:22px 24px}
.map-card h3{margin:0 0 14px;font-size:15px;color:#dbe4f0}
.map-row{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center;
  padding:9px 0;border-bottom:1px solid #141d2c;font-size:12.5px}
.map-row:last-child{border-bottom:0}
.map-row .l{color:#9fdde6;text-align:right}.map-row .r{color:#f3d48a}
.map-row .sw{color:var(--faint);font-size:11px;letter-spacing:1px}
.foot{text-align:center;color:var(--faint);font-size:11.5px;margin-top:24px;line-height:1.8}
</style>
</head>
<body>
<div class="wrap">

  <div class="brand"><span class="dot"></span><b>HUIDONG INDUSTRIAL WIND TUNNEL</b></div>

  <div class="hero">
    <h1>惠东<span class="ac">产业风洞</span></h1>
    <p>同一数据 · 两种问法</p>
  </div>

  <div class="tracks">
    <a class="track cn" href="index.html">
      <div class="ico">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#22d3ee" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-8.5 8.5 8.5 8.5 0 0 1-3.8-.9L3 21l1.9-5.7A8.5 8.5 0 1 1 21 11.5z"/></svg>
      </div>
      <h2>公众叙事轨</h2>
      <div class="kic">好懂 · 有冲击 · 顺着看</div>
      <div class="nodes"><span>今日话题</span><span>吃喝玩乐</span><span>五条路</span><span>风洞</span><span>被忽略</span></div>
      <div class="go">进入叙事 <span>→</span></div>
    </a>

    <div class="relay-mid"><div class="line"></div><div class="chip">换个视角</div></div>

    <a class="track rd" href="v2/index.html">
      <div class="ico">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fbbf24" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      </div>
      <h2>研究证据轨</h2>
      <div class="kic">严谨 · 可检验 · 证据驱动</div>
      <div class="nodes"><span>历史诊断</span><span>理论框架</span><span>网络结构</span><span>多模型</span><span>情景决策</span></div>
      <div class="go">进入研究 <span>→</span></div>
    </a>
  </div>

  <div class="map-card">
    <h3>等价节点 · 接力对照</h3>
    <div class="map-row"><span class="l">基本面</span><span class="sw">↔</span><span class="r">历史结构诊断</span></div>
    <div class="map-row"><span class="l">关系网</span><span class="sw">↔</span><span class="r">网络结构</span></div>
    <div class="map-row"><span class="l">五条路</span><span class="sw">↔</span><span class="r">多模型估计</span></div>
    <div class="map-row"><span class="l">未来 / 风洞</span><span class="sw">↔</span><span class="r">情景推演</span></div>
    <div class="map-row"><span class="l">报告</span><span class="sw">↔</span><span class="r">决策解释</span></div>
  </div>

  <div class="foot">两轨同源、互为视角，数据可追溯口径与血统。<br>本入口为纯新增，旧版与研究版均完整保留，不替代官方决策。</div>

</div>
</body>
</html>
