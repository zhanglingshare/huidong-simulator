<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">

  <title>惠东产业风洞</title>

<body class="hd-page" data-hd-view="home">
  <header class="hd-header">
    <div class="hd-header-inner">
      <a class="hd-brand" href="portal.html">惠东产业风洞</a>
      <nav aria-label="主导航">
        <a href="portal.html#huidong">看惠东</a>
        <a href="windtunnel.html">试情景</a>
      </nav>
    </div>
  </header>

  <main class="hd-shell">
    <section class="hd-home-grid" aria-labelledby="main-title">
      <div class="hd-intro">
        <p class="hd-eyebrow">惠东滨海 · 台风情景</p>
        <h1 id="main-title">台风多停一天，<br>惠东谁最吃紧？</h1>
      </div>
      <figure class="hd-coast" id="coast-stage" aria-label="惠东岸线示意。巽寮、双月湾代表滨海旅游，渔排代表近海养殖，太平岭代表能源。">
        <canvas id="coast-canvas" aria-hidden="true"></canvas>
        <figcaption class="hd-coast-caption">惠东岸线示意</figcaption>
        <span class="hd-place hd-place-xunliao" data-tourism><i></i>巽寮</span>
        <span class="hd-place hd-place-shuangyue" data-tourism><i></i>双月湾</span>
        <span class="hd-place hd-place-energy"><i></i>太平岭</span>
        <span class="hd-place hd-place-fish"><i></i>渔排</span>
        <span class="hd-sea-label">大亚湾 · 红海湾</span>
      </figure>
      <div class="hd-home-control">
        <button type="button" class="hd-primary" id="change-days" aria-pressed="false" disabled><b id="change-days-label">多停一天</b><span aria-hidden="true">＋</span></button>
        <div class="hd-control-note">
          <strong id="home-days">停业 7 天</strong>
          <span>固定风力 · 模拟</span>
        </div>
        <noscript><p>启用 JavaScript 后即可试算。<a href="who.html">查看惠东基本面</a></p></noscript>
      </div>
      <div class="hd-home-metrics">
        <p class="hd-sr-only" id="home-announcement" role="status"></p>
        <div class="hd-split-metric hd-split-metric-tourism">
          <span>当年旅游停业损失</span>
          <strong id="home-loss">—</strong>
          <small id="home-delta">模型估算</small>
        </div>
        <div class="hd-split-metric">
          <span>2030 年全县 GDP 中位数</span>
          <strong data-output="p50">—</strong>
          <small>情景模拟</small>
        </div>
      </div>
      <figure class="hd-chart hd-home-chart" aria-labelledby="home-chart-title">
        <figcaption class="hd-chart-heading">
          <strong id="home-chart-title">滨海客流恢复</strong>
          <span id="home-flow-key">正常水平 = 100%</span>
        </figcaption>
        <canvas id="home-flow" role="img" aria-label="台风情景下的滨海客流恢复曲线"></canvas>
        <div class="hd-chart-weeks" aria-hidden="true"><span>登陆当周</span><span>第 5 周</span><span>第 10 周</span></div>
      </figure>
      <div class="hd-home-links hd-link-row">
        <a class="hd-text-link" id="open-wind" href="windtunnel.html">比较更多情景 <span aria-hidden="true">↗</span></a>
        <a class="hd-text-link" id="open-report" href="report.html">看这次结果 <span aria-hidden="true">↗</span></a>
        <a class="hd-muted-link" href="v2/scenarios.html#typhoon-recovery">查看依据</a>
      </div>
    </section>

    <section class="hd-local" id="huidong" aria-labelledby="local-title">
      <h2 id="local-title">看惠东</h2>
      <p>一段岸线，连着滨海生意、能源项目和渔排。</p>
      <div class="hd-local-grid">
        <a href="network.html"><strong>岸线与产业关系</strong><span>哪些生意和项目连在同一片海上</span><b aria-hidden="true">↗</b></a>
        <a href="who.html"><strong>惠东的家底</strong><span>经济、人口和产业的基本面</span><b aria-hidden="true">↗</b></a>
        <a href="town.html"><strong>惠东各镇</strong><span>镇街、滨海景点和生活信息</span><b aria-hidden="true">↗</b></a>
      </div>
      <details class="hd-details hd-local-more">
        <summary>更多惠东内容</summary>
        <div class="hd-link-row">
          <a class="hd-text-link" href="role.html">从自己的角色看</a>
          <a class="hd-text-link" href="choices.html">五条产业路径</a>
          <a class="hd-text-link" href="future.html">2030 模拟</a>
          <a class="hd-text-link" href="blindspot.html">容易忽略的影响</a>
          <a class="hd-text-link" href="ending.html">惠东结语</a>
          <a class="hd-text-link" href="v2/index.html">研究总览</a>
        </div>
      </details>
    </section>
  </main>
