<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>惠东产业风洞 · 你在网里</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#080b12;color:#e6edf3;font:14px/1.6 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
.nav{position:sticky;top:0;z-index:50;display:flex;gap:5px;align-items:center;padding:9px 14px;background:rgba(8,11,18,.95);border-bottom:1px solid #1b2434;overflow-x:auto}
.nav b{font-size:14px;margin-right:6px;flex:none;color:#fff}
.nav a{background:#131c2b;color:#93a4bd;border:1px solid #22304a;padding:6px 12px;border-radius:20px;font-size:12.5px;text-decoration:none;white-space:nowrap;flex:none}
.nav a.on{background:#0e7490;border-color:#0891b2;color:#fff;font-weight:600}
.wrap{max-width:1200px;margin:auto;padding:18px}

.hero{position:relative;text-align:center;padding:44px 22px 38px;background:
   radial-gradient(ellipse at 50% 130%, #0e3a4a 0%, #082630 40%, #0a0f1a 78%);
  border:1px solid #1c2739;border-radius:16px;margin-bottom:16px;overflow:hidden}
.hero .kick{font-size:11px;letter-spacing:4px;color:#67e8f9;margin-bottom:10px}
.hero h1{font-size:26px;line-height:1.4;margin:0;color:#fff}
.hero h1 .sea{color:#fbbf24}
.hero .sub{font-size:13px;color:#a9b6c9;margin:12px auto 0;max-width:560px;line-height:1.8}

.roles{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:16px}
.rc{background:#0e1523;border:1px solid #1c2739;border-radius:12px;padding:16px;cursor:pointer;text-align:center;transition:.25s}
.rc:hover{border-color:#0891b2;transform:translateY(-2px)}
.rc.on{border-color:#0891b2;background:#0f1f2b;box-shadow:0 0 20px rgba(8,145,178,.2)}
.rc .i{font-size:32px}
.rc .t{font-size:14px;font-weight:700;margin-top:6px;color:#fff}
.rc .s{font-size:11px;color:#7d8fa8;margin-top:4px}

.grid2{display:grid;grid-template-columns:1.2fr 1fr;gap:14px}
@media(max-width:800px){.grid2{grid-template-columns:1fr}}
.card{background:#0e1523;border:1px solid #1c2739;border-radius:14px;padding:16px;margin-bottom:12px}
.card b{font-size:13.5px;color:#cbd5e1}
.mut{color:#64748b;font-size:12px}
.worry{background:#1a1015;border-left:3px solid #f87171;padding:10px 12px;margin:8px 0;border-radius:0 6px 6px 0;font-size:12.5px;color:#fca5a5}
.chk{display:flex;gap:10px;align-items:flex-start;padding:10px;border:1px solid #1c2739;border-radius:8px;margin:8px 0;cursor:pointer;transition:.2s}
.chk:hover{border-color:#0891b2}
.chk.on{border-color:#0891b2;background:#0f1f2b}
.chk input{margin-top:3px}
.chk .t{font-size:13px;font-weight:600;color:#e6edf3}
.chk .d{font-size:12px;color:#8fa3bf;margin:3px 0}
.chk .g{font-size:11px;color:#22d3ee}
.cmp{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #1c2739;font-size:12.5px}
.cmp .l{color:#8fa3bf}
.cmp .r.cy{color:#fbbf24;font-weight:600}
.met{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #1c2739;font-size:12.5px}
.met .n{color:#8fa3bf}
.met .a{color:#94a3b8}
.met .b{color:#22d3ee;font-weight:700}
svg{width:100%;height:auto;background:radial-gradient(ellipse at 50% 45%,#0a1626,#060910);border-radius:10px}
.disc{margin-top:16px;font-size:11px;color:#5b6b8b;padding:12px;background:#0a0f1a;border-radius:8px;line-height:1.7}
</style></head><body>

<div class="wrap">

  <div class="hero">
    <div class="kick">HUIDONG · YOUR PLACE</div>
    <h1>你在惠东这张网里，<span class="sea">是哪个点？</span></h1>
    <p class="sub">山 / 海 / 城——你靠哪边吃饭？<br>选一种活法，看看你身边连着谁、又怕什么、机会在哪。</p>
  </div>

  <div class="roles" id="roleBox"></div>
  <div class="grid2">
    <div class="card"><b>你的局部网络</b> <span class="mut" id="egoTip">先选一种活法</span><svg id="svg" viewBox="0 0 800 600"></svg></div>
    <div>
      <div class="card"><b>我的处境</b><div id="posBox"></div></div>
      <div class="card"><b>我可能在担心什么</b><div id="worBox"></div></div>
      <div class="card"><b>可能存在哪些机会</b><div id="chBox"></div></div>
      <div class="card"><b>结构指标 · 前→后</b><div id="metBox"></div></div>
    </div>
  </div>
  <div class="disc">边界：静态结构估算，不推演时间、不估算产值。数据来源：惠东县统计公报、管委会公开报告。</div>
</div>

<script>
const NODES=[
{id:"xz",name:"平山",x:400,y:300,t:"city"},{id:"dl",name:"大岭",x:350,y:220,t:"ind"},
{id:"bp",name:"白花",x:280,y:180,t:"ind"},{id:"lt",name:"梁化",x:200,y:350,t:"agri"},
{id:"an",name:"安墩",x:150,y:450,t:"tour"},{id:"lq",name:"白盆珠",x:300,y:500,t:"tour"},
{id:"hl",name:"多祝",x:450,y:450,t:"agri"},{id:"jq",name:"稔山",x:550,y:350,t:"tour"},
{id:"ps",name:"平海",x:650,y:400,t:"tour"},{id:"hjj",name:"港口",x:700,y:300,t:"tour"},
{id:"bp2",name:"滨海旅游",x:620,y:350,t:"tour"},{id:"sz2",name:"深圳",x:100,y:200,t:"ext"},
{id:"cl",name:"制鞋业",x:320,y:280,t:"ind"},{id:"sw",name:"海产品",x:650,y:450,t:"agri"},
{id:"w1",name:"县城居民",x:420,y:350,t:"people"},{id:"w2",name:"鞋厂工人",x:300,y:250,t:"people"},
{id:"w3",name:"渔民/养殖户",x:680,y:400,t:"people"},{id:"w4",name:"游客",x:600,y:250,t:"people"},
{id:"w5",name:"农户",x:250,y:400,t:"people"},
];
const EDGES=[["xz","w1"],["dl","cl"],["bp","cl"],["dl","sz2"],["bp","sz2"],
["lt","w5"],["an","lq"],["lq","w5"],["hl","w5"],["jq","bp2"],["ps","hjj"],
["hjj","w4"],["bp2","w4"],["cl","w2"],["sw","w3"],["sw","ps"],
["xz","dl"],["xz","hl"],["jq","ps"],["lq","an"],["sz2","dl"]];
const NM={};NODES.forEach((n,i)=>NM[n.id]=i);
const EI=EDGES.map(e=>[NM[e[0]],NM[e[1]]]).filter(e=>e[0]!=null&&e[1]!=null);
const COLORS={ind:"#0891b2",city:"#3b82f6",agri:"#34d399",tour:"#a78bfa",people:"#f97316",ext:"#64748b"};
const ROLES=[
{k:"shoe",i:"👟",t:"鞋厂工人",s:"大岭白花这一层",
 nodes:["dl","bp","cl","w2"],
 worry:["惠东鞋业量大，但利润薄。","订单跟着国际市场走，外一波动就慌。","自动化在替代人工，怕失业。"],
 opp:[{t:"鞋业品牌化",d:"从代工到自主品牌",g:"利润+1"},{t:"智能制造升级",d:"人少了但效率高",g:"竞争力+1"},{t:"内销渠道",d:"不只靠外贸",g:"抗风险+1"}]},
{k:"sea",i:"🐟",t:"渔民/养殖户",s:"港口平海这一层",
 nodes:["hjj","ps","sw","w3"],
 worry:["台风季一来，排网养殖全没。","海水养殖成本年年涨。","休渔期收入断档。"],
 opp:[{t:"深海养殖平台",d:"抗台风能力强",g:"风险-1"},{t:"海产品深加工",d:"不只是卖鲜货",g:"附加值+1"},{t:"渔旅融合",d:"游客出海体验",g:"额外收入+1"}]},
{k:"tour",i:"🏖️",t:"滨海民宿老板",s:"双月湾港口这一层",
 nodes:["jq","ps","hjj","bp2","w4"],
 worry:["夏天周末满房，冬天空。","台风一来全退订。","民宿越开越多，价格战。"],
 opp:[{t:"冬季温泉+海边套餐",d:"淡季也有客",g:"入住率+1"},{t:"周末微度假产品",d:"深圳客周末来",g:"客流+1"},{t:"小红书内容营销",d:"口碑传播",g:"曝光+1"}]},
{k:"city",i:"🏘️",t:"县城居民",s:"平山过日子的人",
 nodes:["xz","w1"],
 worry:["县城就两条主街，晚上没地方逛。","好工作都在深圳惠州。","孩子教育资源不够。"],
 opp:[{t:"县城商业升级",d:"晚上有地方去",g:"消费+1"},{t:"产业留人",d:"不用跑深圳",g:"就业+1"},{t:"公共服务提升",d:"看病上学不愁",g:"民生+1"}]},
{k:"agri",i:"🌾",t:"山区农户",s:"梁化白盆珠这一层",
 nodes:["lt","an","lq","hl","w5"],
 worry:["路远，好东西运出去难。","年轻人都下山了。","靠山吃山，但生态保护限制多。"],
 opp:[{t:"生态茶园/果园",d:"做高端农产品",g:"单价+1"},{t:"民宿+采摘",d:"城里人上山",g:"额外收入+1"},{t:"冷链出山",d:"好东西卖出去",g:"销路+1"}]},
];
let picked={};
function nIdx(rk){return ROLES.find(r=>r.k===rk).nodes.map(n=>NM[n]).filter(i=>i!=null)}
function ego(i){const rs=ROLES[i];const idx=new Set(nIdx(rs.k));
  const hotE=new Set(EI.map((e,k)=>k).filter(k=>idx.has(EI[k][0])||idx.has(EI[k][1])));
  let h="";EI.forEach((e,k)=>{const a=NODES[e[0]],b=NODES[e[1]];const hot=hotE.has(k);
    h+=`<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="${hot?COLORS[rs.k]:'#1e2b40'}" stroke-width="${hot?1.8:.7}" opacity="${hot?.9:.3}"/>`;});
  NODES.forEach((n,j)=>{const on=idx.has(j);const r=on?10:5;
    h+=`<circle cx="${n.x}" cy="${n.y}" r="${r}" fill="${on?COLORS[n.t]:'#2a3a52'}" opacity="${on?1:.35}"/>`;
    if(on)h+=`<text x="${n.x}" y="${n.y+r+12}" text-anchor="middle" font-size="10" fill="#cbd5e1">${n.name}</text>`;});
  document.getElementById("svg").innerHTML=h;
  document.getElementById("egoTip").textContent=rs.t+" · "+idx.size+" 个主体，"+hotE.size+" 条关系";}
function pos(i){const idx=nIdx(ROLES[i].k);const deg=idx.map(j=>EI.filter(e=>e[0]===j||e[1]===j).length);
  const avg=deg.reduce((a,b)=>a+b,0)/Math.max(deg.length,1);const allAvg=(2*EI.length)/NODES.length;
  document.getElementById("posBox").innerHTML=[["主体数",idx.length],["平均连接",avg.toFixed(1)],["全网均值",allAvg.toFixed(1)],["倍数",(avg/allAvg).toFixed(1)]].map(r=>`<div class="cmp"><span class="l">${r[0]}</span><span class="r cy">${r[1]}</span></div>`).join("");}
function worry(i){document.getElementById("worBox").innerHTML=ROLES[i].worry.map(w=>`<div class="worry">${w}</div>`).join("");}
function opp(i){const b=document.getElementById("chBox");b.innerHTML="";
  ROLES[i].opp.forEach((o,oi)=>{const d=document.createElement("div");d.className="chk"+(picked[i+"_"+oi]?" on":"");
    d.innerHTML=`<input type="checkbox" ${picked[i+"_"+oi]?"checked":""}><div><div class="t">${o.t}</div><div class="d">${o.d}</div><div class="g">${o.g}</div></div>`;
    const inp=d.querySelector("input");d.onclick=ev=>{if(ev.target!==inp)inp.checked=!inp.checked;picked[i+"_"+oi]=inp.checked;d.classList.toggle("on",inp.checked);metric(i)};
    b.appendChild(d);});}
function metric(i){const n=Object.keys(picked).filter(k=>k.startsWith(i+"_")&&picked[k]).length;
  document.getElementById("metBox").innerHTML=[["跨板块连接","基线",`+${n}`],["链条密度","基线",n>=2?"明显":n>=1?"一点":"无"],["替代链路","—",`+${n}`]].map(r=>`<div class="met"><span class="n">${r[0]}</span><span><span class="a">${r[1]}</span> → <span class="b">${r[2]}</span></span></div>`).join("");}
function pick(i){ego(i);pos(i);worry(i);opp(i);metric(i);
  document.querySelectorAll("#roleBox .rc").forEach((el,k)=>el.classList.toggle("on",k===i));}
const rb=document.getElementById("roleBox");
ROLES.forEach((r,i)=>{const d=document.createElement("div");d.className="rc";
  d.innerHTML=`<div class="i">${r.i}</div><div class="t">${r.t}</div><div class="s">${r.s}</div>`;
  d.onclick=()=>pick(i);rb.appendChild(d);});pick(0);
</script>
</body></html>
