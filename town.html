<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>惠东产业风洞 · 各镇吃喝玩乐</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080b12;color:#e6edf3;font:14px/1.65 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
.wrap{max-width:1200px;margin:auto;padding:18px}

/* hero */
.hero{position:relative;text-align:center;padding:44px 22px 38px;background:
   radial-gradient(ellipse at 50% 130%, #0e3a4a 0%, #082630 40%, #0a0f1a 78%);
  border:1px solid #1c2739;border-radius:16px;margin-bottom:16px;overflow:hidden}
.hero .kick{font-size:11px;letter-spacing:4px;color:#67e8f9;margin-bottom:10px}
.hero h1{font-size:26px;line-height:1.4;margin:0;color:#fff}
.hero h1 .sea{color:#fbbf24}
.hero .sub{font-size:13px;color:#a9b6c9;margin:12px auto 0;max-width:600px;line-height:1.8}

/* 扫描条 */
.scan-bar{display:flex;align-items:center;gap:16px;background:#0e1523;border:1px solid #1c2739;border-radius:14px;padding:14px 18px;margin-bottom:14px}
.radar{width:60px;height:60px;flex:none}
.scan-info{font-size:11.5px;color:#7c8b99;margin-top:3px}
.refresh{background:#f59e0b;color:#1a1206;border:0;padding:8px 18px;border-radius:18px;font-size:12.5px;font-weight:700;cursor:pointer;flex:none}

.livebar{background:#1a1206;border:1px solid #7c4a12;border-radius:10px;padding:10px 14px;margin-bottom:14px;font-size:12.5px;color:#fcd34d;line-height:1.7}

/* 当季海味滚动 */
.veg{margin-bottom:16px}
.veg-title{font-size:13px;color:#22d3ee;margin-bottom:8px;font-weight:700}
.veg-track{overflow:hidden;mask-image:linear-gradient(90deg,transparent,#000 4%,#000 96%,transparent)}
.veg-inner{display:flex;gap:10px;animation:vscroll 26s linear infinite;width:max-content}
.veg-track:hover .veg-inner{animation-play-state:paused}
.vegcard{flex:none;background:#0e1523;border:1px solid #134047;border-left:3px solid #0891b2;border-radius:10px;padding:10px 14px;width:200px}
.vegcard .vn{font-size:14px;font-weight:700;color:#e6edf3}
.vegcard .vp{font-size:11px;color:#22d3ee;margin-top:2px}
.vegcard .vd{font-size:11.5px;color:#8fa3bf;margin-top:4px;line-height:1.5}
.vegcard .lv{font-size:11px;font-weight:800;border:1px solid;border-radius:7px;padding:2px 8px;margin-top:6px;display:inline-block}
@keyframes vscroll{from{transform:translateX(0)}to{transform:translateX(-50%)}}

/* 镇街卡片 */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:600px){.grid{grid-template-columns:1fr}}
.town{background:#0e1523;border:1px solid #1c2739;border-radius:14px;padding:16px;position:relative;overflow:hidden;transition:.25s}
.town:hover{transform:translateY(-2px);border-color:#0891b2}
.town.pick{border-color:#0891b2;box-shadow:0 0 0 1px #0891b2 inset}
.town .pick-tag{position:absolute;top:10px;right:10px;background:#0891b2;color:#03161b;font-size:10px;font-weight:800;padding:2px 8px;border-radius:10px}
.town .head{display:flex;align-items:baseline;gap:8px;margin-bottom:6px}
.town .n{font-size:18px;font-weight:800;color:#fff}
.town .tag{font-size:10.5px;color:#22d3ee;background:#082630;border:1px solid #134047;padding:2px 8px;border-radius:10px}
.town .row{font-size:12.5px;color:#cbd5e1;margin-top:5px;line-height:1.7}
.town .row .k{display:inline-block;width:34px;color:#6b7d96}
.town .why{margin-top:9px;padding-top:8px;border-top:1px dashed #1c2739;font-size:12px;color:#8fa3bf;font-style:italic}
.town .lv{font-size:11px;font-weight:800;border:1px solid;border-radius:8px;padding:3px 10px;display:inline-block;margin-top:8px}
.town .src{font-size:9.5px;color:#5b6b82;margin-top:4px;line-height:1.4}

.disc{font-size:11px;color:#5b6b82;margin-top:16px;line-height:1.8;padding:12px;background:#0a0f1a;border-radius:8px}
.next{text-align:center;margin:20px 0}
.next a{background:#0e7490;color:#fff;padding:12px 28px;border-radius:8px;text-decoration:none;font-weight:600;display:inline-block}
</style><link rel="stylesheet" href="huidong.css?v=20261116b">
</head><body class="hd-page hd-content">

<header class="hd-header">
  <div class="hd-header-inner">
    <a class="hd-brand" href="portal.html">惠东产业风洞</a>
    <nav aria-label="主导航">
      <a href="portal.html#huidong">看惠东</a>
      <a href="windtunnel.html">试情景</a>
    </nav>
  </div>
</header>

<div class="wrap">

  <header class="hero">
    <h1>在惠东，<span class="sea">按镇去看</span></h1>
    <p class="sub">点一个镇街，直接看当地的吃法和去处。</p>
  </header>

  <section class="hd-front" aria-label="选择惠东镇街">
    <div class="hd-town-tools">
      <label for="town-select">镇街
        <select id="town-select" disabled><option value="suggested">推荐镇街</option><option value="all">全部镇街</option></select>
      </label>
      <button class="hd-secondary" type="button" id="btnScan" disabled>换一组推荐</button>
    </div>
    <p class="scan-info" id="scanInfo" role="status">正在读取镇街资料</p>
  </section>

  <div class="grid" id="grid"></div>

  <details class="hd-details hd-reading">
    <summary>展开当季农海产品和资料来源</summary>
    <div class="veg">
      <div class="veg-title" id="vegTitle">惠东当季海味和农品</div>
      <div class="veg-track"><div class="veg-inner" id="vegInner"></div></div>
    </div>
    <p class="livebar" id="livebar"></p>
    <p class="disc" id="town-source"></p>
  </details>

  <div class="next"><a href="network.html">下一步：看惠东在大湾区里的位置 →</a></div>
</div>

<script>
let towns = [];
let suggestions = [];
const grid = document.getElementById("grid");
const townSelect = document.getElementById("town-select");
const refresh = document.getElementById("btnScan");

function safe(text) {
  return String(text ?? "").replace(/[&<>"']/g, char => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[char]);
}

function renderTowns() {
  const selection = townSelect.value;
  const shown = selection === "all" ? towns :
    towns.filter(town => selection === "suggested" ? suggestions.includes(town.n) : town.n === selection);
  grid.innerHTML = shown.map(town => `
    <article class="town">
      <div class="head"><h2 class="n">${safe(town.n)}</h2><span class="tag">${safe(town.tag)}</span></div>
      <div class="row"><span class="k">吃</span>${safe((town.foods ?? []).join("、"))}</div>
      <div class="row"><span class="k">去处</span>${safe((town.plays ?? []).join("、"))}</div>
      <div class="why">${safe(town.why)}</div>
      <div class="lv">公开打卡热度 · ${safe(town.level)}</div>
    </article>`).join("");
}

function recommend() {
  const shuffled = [...towns];
  for (let i = shuffled.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
  }
  const next = shuffled.slice(0, 3).map(town => town.n);
  if (towns.length > 3 && next.every(name => suggestions.includes(name))) next[0] = shuffled[3].n;
  suggestions = next;
  townSelect.value = "suggested";
  renderTowns();
}

async function loadLife() {
  const status = document.getElementById("scanInfo");
  try {
    const response = await fetch("life.json", {cache:"no-cache"});
    if (!response.ok) throw new Error("Town data unavailable");
    const data = await response.json();
    towns = Array.isArray(data.towns) ? data.towns : [];
    if (!towns.length) throw new Error("Town data is empty");
    towns.forEach(town => townSelect.add(new Option(town.n, town.n)));
    const season = data.season ? data.season + "季" : "当季";
    document.getElementById("vegTitle").textContent = "惠东" + season + "海味和农品";
    document.getElementById("vegInner").innerHTML = (data.veg ?? []).map(item =>
      `<div class="vegcard"><div class="vn">${safe(item.n)}</div><div class="vp">${safe(item.p)}</div><div class="vd">${safe(item.d)}</div></div>`).join("");
    document.getElementById("livebar").textContent = (data.pulse ?? []).join(" ｜ ");
    document.getElementById("town-source").textContent = (data.sourceLabel ?? "公开资料") +
      "。镇街人气按公开打卡热度分档。";
    status.textContent = "资料更新于 " + (data.updated ?? "日期未标注") + " · " + towns.length + " 条镇街资料";
    townSelect.disabled = false;
    refresh.disabled = false;
    recommend();
  } catch {
    status.textContent = "暂时无法读取镇街资料";
    grid.innerHTML = '<p class="town-empty">可刷新页面重试，或先看<a href="who.html">惠东基本面</a>。</p>';
  }
}

townSelect.addEventListener("change", renderTowns);
refresh.addEventListener("click", recommend);
loadLife();
</script>
</body></html>
