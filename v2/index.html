<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>惠东产业风洞 · 总览</title>
<link rel="stylesheet" href="assets/app.css">
</head>
<body>

<div class="nav">
  <span class="brand">惠东产业风洞</span>
  <a href="index.html" class="on">总览</a>
  <a href="history.html">历史诊断</a>
  <a href="theory.html">机制框架</a>
  <a href="network.html">网络结构</a>
  <a href="models.html">路径研判</a>
  <a href="measurement.html">调研佐证</a>
  <a href="scenarios.html">情景推演</a>
  <a href="decision.html">决策解释</a>
</div>

<div class="wrap">

  <div class="demo-banner">
    <span>●</span>
    <span><b>部分为已核实数据</b>：历年经济总量来自官方公开数据；其余分区为模拟示例，随证据到位逐步点亮，模拟内容仅供参考。</span>
  </div>

  <div class="hero">
    <div class="kick">HUIDONG INDUSTRIAL WIND TUNNEL · V2</div>
    <h1>证据驱动的<span class="accent">产业研究系统</span></h1>
    <p class="sub">先看真实家底，再看关系与可能的未来。<br>拿不准的地方给范围，不假装精确。</p>
  </div>

  <div class="grid grid-3" id="chain"></div>

  <p class="takeaway"><span class="mk">解读</span>这是一条从看清家底到辅助决策的完整路径：先证据、后判断，拿不准的环节只给范围、不假装精确。</p>

  <div class="plain" style="margin-top:18px">
    <span class="lab">数据说明</span>
    图中数字区分“已核实”与“模拟”，每个数字都能追溯来源；模拟部分仅作参考，不代表真实结论。
  </div>

</div>

<script>
const stages=[
  {n:'01',t:'历史结构诊断',d:'2020–2025 历年家底 · 三产结构',status:'ready',href:'history.html'},
  {n:'02',t:'机制与变量',d:'分层机制 · 变量说明 · 待验证判断',status:'pending'},
  {n:'03',t:'网络结构分析',d:'关系连线 · 历年变化 · 价值留存',status:'pending'},
  {n:'04',t:'路径研判',d:'各条路径的强弱对比',status:'pending'},
  {n:'05',t:'情景推演',d:'不同条件下的可能范围',status:'pending'},
  {n:'06',t:'决策解释',d:'三把尺子 · 参考范围 · 观察指标',status:'pending'}
];
const badge = s => s==='ready'
  ? '<span class="tag A">已就绪</span>'
  : '<span class="tag C">待数据</span>';
document.getElementById('chain').innerHTML = stages.map(s=>{
  const inner = `<div style="font-size:11px;color:#64748b;letter-spacing:2px">${s.n}</div>
    <div style="font-size:15px;font-weight:700;color:#fff;margin:5px 0">${s.t}</div>
    <div style="font-size:11.5px;color:#93a4bd;line-height:1.6;min-height:36px">${s.d}</div>
    <div style="margin-top:10px">${badge(s.status)}</div>`;
  return s.href
    ? `<a class="card" href="${s.href}" style="text-decoration:none;display:block">${inner}</a>`
    : `<div class="card" style="opacity:.75">${inner}</div>`;
}).join('');
</script>
<script src="relay.js"></script></body>
</html>
