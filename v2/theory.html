<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>惠东产业风洞 · 理论框架</title>
<link rel="stylesheet" href="assets/app.css">
<style>
.layer{position:relative;overflow:hidden}
.layer .lid{font-size:12px;letter-spacing:2px;color:#22d3ee}
.layer .lname{font-size:17px;font-weight:800;color:#fff;margin:6px 0}
.layer .arrow{text-align:center;color:#22d3ee;font-size:20px;margin:2px 0}
.hyp{display:flex;gap:12px;align-items:flex-start;background:var(--surface2);
  border:1px solid var(--border);border-radius:12px;padding:15px 16px;margin-bottom:10px}
.hyp .htype{flex:none}
.hyp .htxt{font-size:13.5px;line-height:1.8;color:#dbe4f0}
.dict-table{width:100%;border-collapse:collapse;font-size:12.5px}
.dict-table th{text-align:left;color:#64748b;font-weight:700;padding:9px 10px;border-bottom:1px solid var(--border2);font-size:11.5px}
.dict-table td{padding:9px 10px;border-bottom:1px solid #141d2c;color:#cbd5e1}
.dict-table td:first-child{color:#22d3ee;font-weight:700}
</style>
</head>
<body>

<div class="nav">
  <span class="brand">惠东产业风洞</span>
  <a href="index.html">总览</a>
  <a href="history.html">历史诊断</a>
  <a href="theory.html" class="on">理论框架</a>
  <a href="network.html">网络结构</a>
  <a href="models.html">多模型估计</a>
  <a href="scenarios.html">情景推演</a>
  <a href="decision.html">决策解释</a>
</div>

<div class="wrap">

  <div class="demo-banner"><span>●</span>
    <span><b>示例框架</b>：理论结构与假说为研究设计，待真实数据检验；通过后由后台写入并移除本横幅。</span></div>

  <div class="hero">
    <div class="kick">THEORETICAL FRAMEWORK</div>
    <h1>用三层理论，<span class="accent">把机制讲清楚</span></h1>
    <p class="sub">先有理论与可证伪假说，再让数据说话。<br>微观系数不直接折算 GDP；模型复杂度不超过证据支撑。</p>
  </div>

  <div class="section-title">三层理论模型</div>
  <div class="grid grid-3" id="layers"></div>

  <div class="section-title">两类不确定性</div>
  <div class="grid grid-2" id="unc"></div>

  <div class="section-title">预注册假说（可证伪）</div>
  <div id="hyp"></div>

  <div class="section-title">变量字典（节选）</div>
  <div class="card">
    <table class="dict-table">
      <thead><tr><th>Key</th><th>名称</th><th>单位</th><th>口径</th><th>来源</th><th>血统</th></tr></thead>
      <tbody id="dict"></tbody>
    </table>
  </div>

</div>

<script src="data/payload.js"></script>
<script>
function load(){fetch('data/payload.json').then(r=>r.json()).then(render).catch(()=>render(window.__EMBEDDED_PAYLOAD__));}
function render(d){
  document.getElementById('layers').innerHTML = d.theory.layers.map((l,i)=>
    `<div class="card layer"><div class="lid">${l.id}</div><div class="lname">${l.name}</div>
     <div class="muted" style="font-size:12.5px;line-height:1.7;min-height:60px">${l.desc}</div>
     <div class="plain" style="margin-top:10px;font-size:11.5px;padding:10px 12px">${l.micro}</div></div>`).join('');

  document.getElementById('unc').innerHTML = d.theory.uncertainty.map(u=>
    `<div class="card"><h2>${u.kind}</h2><div class="muted" style="font-size:12.5px;line-height:1.8;margin-top:8px">${u.desc}</div></div>`).join('');

  const htype = t => t==='反常识' ? '<span class="tag C">反常识</span>'
    : t==='已有初步证据' ? '<span class="tag A">初步证据</span>' : '<span class="tag B">待检验</span>';
  document.getElementById('hyp').innerHTML = d.theory.hypotheses.map(h=>
    `<div class="hyp"><span class="htype">${htype(h.type)}</span><div class="htxt">${h.text}</div></div>`).join('');

  document.getElementById('dict').innerHTML = d.dictionary.map(x=>
    `<tr><td>${x.key}</td><td>${x.name}</td><td>${x.unit}</td><td>${x.caliber}</td><td>${x.source}</td><td><span class="tag ${x.blood}">${x.blood}</span></td></tr>`).join('');
}
load();
</script>
<script src="relay.js"></script></body>
</html>
