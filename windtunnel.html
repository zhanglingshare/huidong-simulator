<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#09151f">
  <title>试情景 · 惠东产业风洞</title>
  <link rel="stylesheet" href="huidong.css">
  <script defer src="model.js?v=20261116a"></script>
  <script defer src="scenario.js"></script>
  <script defer src="scenario-ui.js"></script>
<link rel="stylesheet" href="ui/premium.css">
<script>/* premium 样式偶发 503：失败自动重试一次 */
(function(){var r={};Array.prototype.forEach.call(
document.querySelectorAll('link[rel="stylesheet"][href*="premium"]'),
function(l){l.addEventListener("error",function(){if(r[l.href])return;r[l.href]=1;
var s=document.createElement("link");s.rel="stylesheet";
s.href=l.href.split("?")[0]+"?retry="+Date.now();document.head.appendChild(s);});});})();</script>
</head>
<body class="hd-page" data-hd-view="wind">
  <header class="hd-header">
    <div class="hd-header-inner">
      <a class="hd-brand" href="portal.html">惠东产业风洞</a>
      <nav aria-label="主导航">
        <a href="portal.html#huidong">看惠东</a>
        <a href="windtunnel.html" aria-current="page">试情景</a>
      </nav>
    </div>
  </header>

  <main class="hd-shell hd-wind">
    <header class="hd-page-intro">
      <p class="hd-eyebrow">惠东产业风洞 · 情景模拟</p>
      <h1>改一个条件，看看哪里先变</h1>
    </header>

    <div class="hd-choices" role="group" aria-label="选择情景">
      <button type="button" data-scene="storm" aria-pressed="true">台风停业</button>
      <button type="button" data-scene="shoe" aria-pressed="false">女鞋承压</button>
      <button type="button" data-scene="energy" aria-pressed="false">能源提速</button>
    </div>

    <div class="hd-experiment">
      <section class="hd-experiment-action" aria-labelledby="experiment-title">
        <h2 id="experiment-title">台风多停一天</h2>
        <p id="wind-comparison" class="hd-comparison"></p>
        <p id="wind-condition"></p>
        <button type="button" class="hd-primary" id="change-condition" hidden>多停一天</button>
        <details class="hd-details hd-tuning">
          <summary>细调条件</summary>
          <div class="hd-tuning-grid">
            <label for="strength">台风相对强度 <output for="strength" id="strengthV">100%</output></label>
            <input type="range" id="strength" min="0" max="150" value="100">
            <label for="days">涉海停业天数 <output for="days" id="daysV">7 天</output></label>
            <input type="range" id="days" min="0" max="14" value="7">
            <label for="delay">太平岭核电投产延迟 <output for="delay" id="delayV">0 年</output></label>
            <input type="range" id="delay" min="0" max="2" value="0">
            <label for="shoe">女鞋行业景气 <output for="shoe" id="shoeV">100%</output></label>
            <input type="range" id="shoe" min="70" max="120" value="100">
          </div>
        </details>
      </section>
      <section class="hd-observation" aria-labelledby="observation-title">
        <h2 id="observation-title">滨海客流恢复</h2>
        <div id="wind-storm-chart">
          <figure class="hd-chart">
            <figcaption class="hd-chart-heading">
              <span id="wind-flow-note"></span>
              <span>正常水平 = 100%</span>
            </figcaption>
            <canvas id="wind-flow" role="img" aria-label="台风情景下的滨海客流恢复曲线"></canvas>
            <div class="hd-chart-weeks" aria-hidden="true"><span>登陆当周</span><span>第 5 周</span><span>第 10 周</span></div>
          </figure>
          <div class="hd-sector-list" aria-label="当年行业净损失（模拟）">
            <div><span>旅游停业损失</span><strong id="storm-tourism">—</strong></div>
            <div><span>渔业与海洋牧场损失</span><strong id="storm-fishery">—</strong></div>
            <div><span>台风净损失合计</span><strong id="storm-total">—</strong></div>
          </div>
        </div>
        <div id="wind-path-chart" hidden>
          <p id="path-unit" class="hd-observation-note">单条路径的模拟贡献（亿元）</p>
          <div class="hd-path-row"><span id="path-reference-label"></span><strong id="path-reference-value"></strong><div class="hd-path-track"><i id="path-reference-bar"></i></div></div>
          <div class="hd-path-row"><span id="path-current-label"></span><strong id="path-current-value"></strong><div class="hd-path-track"><i id="path-current-bar"></i></div></div>
        </div>
        <a class="hd-muted-link" data-evidence href="v2/scenarios.html#typhoon-recovery">查看依据</a>
      </section>
    </div>

    <section class="hd-result-strip" aria-label="2030 年全县模拟结果">
      <p id="wind-announcement" class="hd-sr-only" role="status"></p>
      <div><span>2030 年全县 GDP 中位数</span><strong data-output="p50">—</strong></div>
      <div><span>中央 80% 模拟区间</span><strong data-output="range">—</strong></div>
      <div><span>越过 1,200 亿参考线的比例</span><strong data-output="hit">—</strong></div>
      <a class="hd-primary" id="open-report" href="report.html">看这次结果 <span aria-hidden="true">↗</span></a>
    </section>
    <noscript><p>启用 JavaScript 后即可试算。<a href="who.html">查看惠东基本面</a></p></noscript>
  </main>
</body>
</html>
